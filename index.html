<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jooyoung Roh | Profile</title>

  <meta name="description" content="Jooyoung Roh profile hub. Choose Security Engineer or Conductor profile.">
  <meta name="author" content="Jooyoung Roh">
  <meta property="og:title" content="Jooyoung Roh | Profile">
  <meta property="og:description" content="Security Engineer and Conductor profile hub.">
  <meta property="og:image" content="https://zoocandoit.github.io/assets/images/og-image.png">
  <meta property="og:url" content="https://zoocandoit.github.io">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="profile-hub">
  <main class="hub-shell">
    <section class="hub-welcome" aria-labelledby="welcome-title">
      <p id="welcome-title">Welcome !</p>
      <h1>This is JooYoung Roh Page</h1>
    </section>

    <section class="profile-choice-grid" aria-label="Profile choices">
      <a class="profile-banner security-banner" href="./security/" aria-label="Open Security Engineer profile">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M10 14h44v30H10z" />
            <path d="M26 44h12v8H26z" />
            <path d="M20 52h24" />
            <path d="M18 22h14" />
            <path d="M18 30h8" />
            <path d="M39 23l5 5-5 5" />
            <path d="M34 33l-4 5" />
          </svg>
        </span>
        <strong>Security Engineer</strong>
        <span class="profile-action">View Profile</span>
      </a>

      <a class="profile-banner conductor-banner" href="./conductor/" aria-label="Open Conductor profile">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M22 42V16l24-4v26" />
            <path d="M22 42c0 5-4 8-9 8s-8-2-8-6 4-7 9-7c3 0 6 1 8 3Z" />
            <path d="M46 38c0 5-4 8-9 8s-8-2-8-6 4-7 9-7c3 0 6 1 8 3Z" />
            <path d="M22 24l24-4" />
          </svg>
        </span>
        <strong>Conductor</strong>
        <span class="profile-action">View Profile</span>
      </a>
    </section>
  </main>

  <script>
    const root = document.documentElement;

    window.addEventListener("pointermove", (event) => {
      const x = Math.round((event.clientX / window.innerWidth) * 100);
      const y = Math.round((event.clientY / window.innerHeight) * 100);

      root.style.setProperty("--cursor-x", `${x}%`);
      root.style.setProperty("--cursor-y", `${y}%`);
    });

    document.querySelectorAll(".profile-banner").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        event.preventDefault();

        const rect = link.getBoundingClientRect();
        const x = `${Math.round(rect.left + rect.width / 2)}px`;
        const y = `${Math.round(rect.top + rect.height / 2)}px`;

        root.style.setProperty("--transition-x", x);
        root.style.setProperty("--transition-y", y);
        sessionStorage.setItem("profileTransition", "in");

        link.classList.add("is-transitioning");
        if (link.classList.contains("conductor-banner")) {
          document.body.classList.add("page-transition-light");
        }
        document.body.classList.add("page-transition-out");

        window.setTimeout(() => {
          window.location.href = link.href;
        }, 430);
      });
    });

    if (sessionStorage.getItem("profileTransition") === "home") {
      sessionStorage.removeItem("profileTransition");
      document.body.classList.add("page-transition-in");
      window.setTimeout(() => document.body.classList.remove("page-transition-in"), 650);
    }
  </script>
</body>

</html>
