<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Confluence 다중 문서 조회 워크플로</title>
  <desc id="desc">에이전트가 전달한 문서 ID 목록을 분리하고, 각 문서를 순차 조회해 본문을 결과에 추가한 뒤 에이전트에 반환한다. 사용자 지정 커넥터와 온프레미스 게이트웨이로 Confluence에 연결한다. 실제 구현 기록을 바탕으로 재구성한 공개용 설명도이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10" fill="none" stroke="#087d88" stroke-width="2"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#f3f6fa"/>
  <rect width="1200" height="130" fill="#192b40"/>
  <g font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="48" y="58" font-size="34" font-weight="700" fill="#fff">Confluence 다중 문서 조회</text>
    <text x="48" y="99" font-size="21" fill="#c4d5e6">실제 Power Automate 흐름을 바탕으로 재구성한 공개용 설명도</text>
    <g fill="none" stroke="#087d88" stroke-width="3" marker-end="url(#arrow)">
      <path d="M600 262V299"/><path d="M600 398V439"/><path d="M600 649V689"/>
    </g>
    <g fill="#fff" stroke="#cbd8e5" stroke-width="2">
      <rect x="180" y="166" width="840" height="96" rx="8"/>
      <rect x="180" y="302" width="840" height="96" rx="8"/>
      <rect x="48" y="442" width="1104" height="207" rx="8"/>
      <rect x="180" y="692" width="840" height="96" rx="8"/>
    </g>
    <g font-size="26" fill="#20354b" font-weight="700">
      <text x="212" y="204">01  에이전트에서 흐름 호출</text>
      <text x="212" y="340">02  문서 ID 목록과 결과 변수 준비</text>
      <text x="80" y="485">03  문서별 순차 조회</text>
      <text x="212" y="730">04  모은 결과를 에이전트에 반환</text>
    </g>
    <g font-size="21" fill="#52677d">
      <text x="212" y="239">조회할 문서의 ID 목록 전달</text>
      <text x="212" y="375">목록을 분리하고 조회 결과를 담을 변수 초기화</text>
      <text x="212" y="765">여러 문서의 본문을 답변 작성에 활용</text>
    </g>
    <g fill="#eaf4f5" stroke="#bedbdd">
      <rect x="80" y="518" width="308" height="86" rx="6"/>
      <rect x="446" y="518" width="308" height="86" rx="6"/>
      <rect x="812" y="518" width="308" height="86" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="700" fill="#155d65">
      <text x="234" y="570">Confluence 본문 조회</text>
      <text x="600" y="570">조회 결과에 추가</text>
      <text x="966" y="570">다음 조회 전 대기</text>
    </g>
    <g fill="none" stroke="#087d88" stroke-width="3" marker-end="url(#arrow)">
      <path d="M390 561H438"/><path d="M756 561H804"/>
    </g>
    <text x="80" y="632" font-size="18" fill="#52677d">각 문서의 응답을 확인한 뒤 다음 문서를 처리</text>
    <path d="M48 825H1152" stroke="#cbd8e5"/>
    <text x="48" y="864" font-size="21" fill="#52677d">연결 경로  ·  사용자 지정 커넥터 → 온프레미스 게이트웨이 → Confluence</text>
  </g>
</svg>
